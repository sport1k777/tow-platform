services:
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: tow-platform-postgres
    environment:
      POSTGRES_USER: tow
      POSTGRES_PASSWORD: tow
      POSTGRES_DB: tow_platform
    ports:
      - "5433:5432"
    volumes:
      - tow_platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tow -d tow_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tow_platform_pgdata:
